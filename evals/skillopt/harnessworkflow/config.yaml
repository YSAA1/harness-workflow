model:
  backend: claude_chat
  optimizer_backend: claude_chat
  target_backend: claude_chat
  optimizer: claude-sonnet-4-6
  target: claude-sonnet-4-6
  reasoning_effort: low
  rewrite_reasoning_effort: ""

train:
  num_epochs: 1
  train_size: 2
  batch_size: 2
  accumulation: 1
  seed: 42

gradient:
  minibatch_size: 2
  merge_batch_size: 8
  analyst_workers: 1
  max_analyst_rounds: 1
  failure_only: true

optimizer:
  learning_rate: 1
  min_learning_rate: 1
  lr_scheduler: constant
  lr_control_mode: fixed
  skill_update_mode: patch
  use_slow_update: false
  use_meta_skill: false

evaluation:
  use_gate: true
  sel_env_num: 2
  test_env_num: 2
  eval_test: true

env:
  name: harnessworkflow
  skill_init: ""
  split_mode: split_dir
  split_dir: ""
  out_root: ""
  limit: 0
