name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Plugin checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Codex plugin
        run: node scripts/check-plugin.mjs

      - name: Check skill routing evals
        run: node scripts/check-skills-routing.mjs

      - name: Check Claude Code plugin
        run: node scripts/check-claude-code-install.mjs

      - name: Validate Claude Code plugin when CLI is available
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate .
          else
            echo "claude CLI not installed; skipped plugin validator"
          fi

      - name: Check Cursor adapter
        run: node scripts/check-cursor-install.mjs

      - name: Dry-run Cursor project install
        run: node scripts/install-cursor.mjs --target . --dry-run

      - name: Check generated skill flow HTML
        run: |
          node scripts/generate-skill-flow-html.mjs
          git diff --exit-code -- docs/skill-flow-review
          test -z "$(git ls-files --others --exclude-standard -- docs/skill-flow-review)"

      - name: Check whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          else
            git diff --check "${{ github.event.before }}...${{ github.sha }}"
          fi

      - name: Check README assets
        run: |
          test -f docs/assets/readme/harness-workflow-icon.png
          test -f docs/assets/readme/harness-workflow-figure.png
          test -f docs/assets/readme/harness-fit-figure.png
          test -f .cursor/skills/find-skills/SKILL.md
