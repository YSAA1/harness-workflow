name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Structure checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check repo structure and install surface
        run: node scripts/check-plugin.mjs

      - name: Validate Claude Code plugin when CLI is available
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate .
          else
            echo "claude CLI not installed; skipped plugin validator"
          fi

      - name: Run harness-builder script tests
        run: python3 -B skills/harness-builder/tests/test_scripts.py
