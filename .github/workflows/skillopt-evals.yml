name: SkillOpt evals

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-evals:
    name: Deterministic SkillOpt evals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Evaluate harness-builder skill
        run: |
          node scripts/run-skillopt-eval.mjs --skill harness-builder --skill-file skills/harness-builder/SKILL.md --suite canary
          node scripts/check-skillopt-eval.mjs docs/skillopt/runs/latest/summary.json

      - name: Evaluate brainstorm skill
        run: |
          node scripts/run-skillopt-eval.mjs --skill brainstorm --skill-file skills/brainstorm/SKILL.md --suite canary
          node scripts/check-skillopt-eval.mjs docs/skillopt/runs/latest/summary.json

      - name: Evaluate plan skill
        run: |
          node scripts/run-skillopt-eval.mjs --skill plan --skill-file skills/plan/SKILL.md --suite canary
          node scripts/check-skillopt-eval.mjs docs/skillopt/runs/latest/summary.json

      - name: Evaluate implement skill
        run: |
          node scripts/run-skillopt-eval.mjs --skill implement --skill-file skills/implement/SKILL.md --suite canary
          node scripts/check-skillopt-eval.mjs docs/skillopt/runs/latest/summary.json

      - name: Check SkillOpt bench protocol
        run: node scripts/check-skill-bench.mjs

      - name: Check Codex plugin
        run: node scripts/check-plugin.mjs

      - name: Check Claude Code plugin
        run: node scripts/check-claude-code-install.mjs

      - name: Check Cursor adapter
        run: node scripts/check-cursor-install.mjs

      - name: Dry-run Cursor project install
        run: node scripts/install-cursor.mjs --target . --dry-run
